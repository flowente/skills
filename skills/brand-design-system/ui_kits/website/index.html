<script type="text/babel">
const { SvgFilters, Nav, Hero, FeatureSection, CardGrid, QuoteRow, Footer } = window.FlowenteDesignSystem_a30345;
function Home() {
  const [theme, setTheme] = React.useState("light");
  React.useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  return (
    <div className="page-fade">
      <SvgFilters />
      <Nav />
      <main>
        <Hero />
        <FeatureSection title={<>Meno lavoro ripetitivo.<br />Più cose che scorrono.</>} text="Un agente legge, cerca, decide e agisce al posto del tuo team sui compiti che non aggiungono valore. Misurabile dal primo mese." ctaLabel="Scopri lo Studio" mark="onde" shape="square" />
        <FeatureSection reverse title={<>Dalla strategia<br />al modello in produzione.</>} text="Un solo partner dall'idea alla messa online: consulenza, sviluppo di applicazioni e implementazione dei modelli. Niente dispersione." ctaLabel="Come lavoriamo" mark="flusso" shape="blob" />
        <CardGrid />
        <QuoteRow />
      </main>
      <Footer />
      <button id="theme-btn" onClick={() => setTheme(theme === "light" ? "dark" : "light")}>{theme === "light" ? "◐ dark" : "◑ light"}</button>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Home />);
</script></body></html>
