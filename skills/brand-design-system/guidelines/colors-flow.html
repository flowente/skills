<!-- @dsCard group="Colors" viewport="700x120" name="Flow Blue" subtitle="The single accent — marks, shapes and dots only, never buttons" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg)}.row{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--border)}.sw{flex:1;height:56px;position:relative}.sw span{position:absolute;left:6px;bottom:4px;font-family:var(--font-mono);font-size:9px}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--flow-100)"><span style="color:#1B2ED6">100 E4E7FF</span></div>
<div class="sw" style="background:var(--flow-400)"><span style="color:#fff">400 6B7CFF</span></div>
<div class="sw" style="background:var(--flow-500)"><span style="color:#fff">500 3A55FF</span></div>
<div class="sw" style="background:var(--flow-600)"><span style="color:#fff">600 2540FF ★</span></div>
<div class="sw" style="background:var(--flow-700)"><span style="color:#fff">700 1B2ED6</span></div>
</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:8px">--accent = flow-600 light / flow-500 dark · never on buttons or body text</div>
</body></html>
