<!-- @dsCard group="Colors" viewport="700x150" name="Semantic roles — dark" subtitle="Same roles under [data-theme=dark]" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tk{border:1px solid var(--border);border-radius:8px;overflow:hidden}.tk .c{height:44px}.tk .l{font-family:var(--font-mono);font-size:9px;padding:5px 7px;color:var(--text-2);background:var(--surface)}</style></head><body>
<div class="grid">
<div class="tk"><div class="c" style="background:var(--bg)"></div><div class="l">--bg 0B0B0C</div></div>
<div class="tk"><div class="c" style="background:var(--surface)"></div><div class="l">--surface 141416</div></div>
<div class="tk"><div class="c" style="background:var(--surface-2)"></div><div class="l">--surface-2 1D1D20</div></div>
<div class="tk"><div class="c" style="background:var(--border)"></div><div class="l">--border 2A2A2F</div></div>
<div class="tk"><div class="c" style="background:var(--text)"></div><div class="l">--text FBFBF9</div></div>
<div class="tk"><div class="c" style="background:var(--text-2)"></div><div class="l">--text-2 B4B4BA</div></div>
<div class="tk"><div class="c" style="background:var(--muted)"></div><div class="l">--muted 8A8A92</div></div>
<div class="tk"><div class="c" style="background:var(--accent)"></div><div class="l">--accent 3A55FF</div></div>
</div>
</body></html>
